# Local full-stack run. On Coolify, deploy backend and frontend as separate
# services (and the indexer as a scheduled task) — see README.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: backend/.env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5174:80"
    depends_on:
      - backend
